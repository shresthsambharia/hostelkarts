services:
  - type: web
    name: hostelkart-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn app:app"
    disk:
      name: hostelkart-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: RENDER_DISK_PATH
        value: /data
      - key: SECRET_KEY
        generateValue: true
